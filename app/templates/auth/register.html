{% extends 'base.html' %}

{% block title %}Sign up{% endblock %}
{% block header %}Create an account{% endblock %}

{% block content %}
<form method="post" class="card form">
  <label for="username">Username</label>
  <input name="username" id="username" required value="{{ request.form.get('username', '') }}">
  <label for="display_name">Display name <span class="muted">(shown on matches; defaults to username)</span></label>
  <input name="display_name" id="display_name" value="{{ request.form.get('display_name', '') }}">
  <label for="password">Password</label>
  <input type="password" name="password" id="password" required minlength="6">
  <button type="submit">Sign up</button>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</form>
{% endblock %}
