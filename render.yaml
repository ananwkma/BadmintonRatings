services:
  - type: web
    name: badminton-ratings
    runtime: python
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
